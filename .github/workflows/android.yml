name: LocalDB Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LocalDB host and Core
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # MainCourse is checked out explicitly so the APK is always built from the central source of truth.
      - name: Checkout MainCourse
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainCourse
          ref: main
          path: academy-main-course

      # MainUi is the shared presentation layer consumed by every thin Course App.
      - name: Checkout MainUi
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainUi
          ref: main
          path: academy-main-ui

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Validate MainCourse package
        run: python3 scripts/validate_course.py
      - name: Validate app and MainCourse versions
        run: python3 scripts/validate_version.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release variant
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-LocalDB-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-LocalDB-release-unsigned
          path: app/build/outputs/apk/release/*.apk
