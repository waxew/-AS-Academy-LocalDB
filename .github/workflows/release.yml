name: LocalDB Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Validate course package
        run: python3 scripts/validate_course.py
      - name: Validate app and course versions
        run: python3 scripts/validate_version.py
      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AS_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/as-academy-release.jks"
      - name: Build signed release APK
        env:
          AS_RELEASE_STORE_FILE: ${{ runner.temp }}/as-academy-release.jks
          AS_RELEASE_STORE_PASSWORD: ${{ secrets.AS_RELEASE_STORE_PASSWORD }}
          AS_RELEASE_KEY_ALIAS: ${{ secrets.AS_RELEASE_KEY_ALIAS }}
          AS_RELEASE_KEY_PASSWORD: ${{ secrets.AS_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare release files
        run: |
          mkdir -p release-output
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" release-output/AS-Academy-LocalDB-v0.3.0.apk
          sha256sum release-output/AS-Academy-LocalDB-v0.3.0.apk | tee release-output/SHA256.txt
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs release-output/AS-Academy-LocalDB-v0.3.0.apk | tee release-output/signature-verification.txt
      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-LocalDB-v0.3.0-release
          path: release-output/*
          if-no-files-found: error
