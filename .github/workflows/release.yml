name: LocalDB Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Validate course package
        run: python3 scripts/validate_course.py
      - name: Validate app and course versions
        run: python3 scripts/validate_version.py
      - name: Resolve release version
        id: version
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('release-baseline.json').read_text())
          print(data['nextVersionName'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match v$VERSION" >&2
            exit 1
          fi
      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AS_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/as-academy-release.jks"
      - name: Build signed release APK
        env:
          AS_RELEASE_STORE_FILE: ${{ runner.temp }}/as-academy-release.jks
          AS_RELEASE_STORE_PASSWORD: ${{ secrets.AS_RELEASE_STORE_PASSWORD }}
          AS_RELEASE_KEY_ALIAS: ${{ secrets.AS_RELEASE_KEY_ALIAS }}
          AS_RELEASE_KEY_PASSWORD: ${{ secrets.AS_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-output
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          OUT="release-output/AS-Academy-LocalDB-v${VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee release-output/SHA256.txt
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$OUT" | tee release-output/signature-verification.txt
      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-LocalDB-v${{ steps.version.outputs.version }}-release
          path: release-output/*
          if-no-files-found: error
